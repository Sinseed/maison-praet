name: CI

# Filet de sécurité : à chaque push et chaque pull request, on vérifie que le
# projet compile (types + build Next.js). Comme `main` est déployé
# automatiquement en production par Vercel, ce garde-fou empêche qu'un push
# cassé parte en ligne. Aucun secret requis : le build fonctionne sans clé
# (les clés Resend / Anthropic ne sont lues qu'à l'exécution).

on:
  push:
    branches: ['**']
  pull_request:
    branches: ['**']

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - name: Installer les dépendances
        run: npm ci
      - name: Vérifier types + build
        run: npm run check
